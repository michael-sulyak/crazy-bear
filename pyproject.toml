[tool.poetry]
name = "crazy_bear"
version = "0.1.0"
description = ""
authors = ["expert_m"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
requests = {extras = ["socks"], version = "^2.32.5"}
pytz = "^2025.2"
emoji = "^2.8.0"
pyserial = "^3.5"
opencv-python = { version = "~4.10.0", optional = true }
imutils = "^0.5.4"
numpy = { version = "~2.3.5", optional = true }
matplotlib = { version = "~3.10.7", optional = true }
sqlalchemy = { extras = ["asyncio"], version = "^2.0.21" }
sentry-sdk = "^2.13.0"
dropbox = "^12.0.2"
openpyxl = "^3.1.2"
pytest = "^9.0.2"
wheel = "^0.46.3"
pandas = { version = "~2.3.3", optional = true }
scipy = { version = "~1.16.3", optional = true }
python-dotenv = "^1.0.0"
crontab = "^1.0.1"
psycopg2-binary = { version = "~2.9.11", optional = true }
paho-mqtt = "^2.0.0"
mplcyberpunk = "^0.7.0"
python-telegram-bot = {extras = ["socks"], version = "^22.7"}
pika = "^1.3.2"
environs = "^14.2.0"
tplinkrouterc6u = "^5.27.0"
aiohttp = "^3.12.4"
jinja2 = "^3.1.6"

[tool.poetry.extras]
heavy = ["numpy", "matplotlib", "pandas", "scipy", "psycopg2-binary"]

[tool.poetry.group.dev.dependencies]
pika-stubs = "^0.1.3"
types-requests = "^2.31.0.8"
types-pytz = "^2025.2.0"
numpy-stubs = { git = "https://github.com/numpy/numpy-stubs" }
mypy = "^1.5.1"
mypy-extensions = "^1.0.0"
ruff = "^0.15.2"

[build-system]
requires = ["poetry>=1.0.0"]
build-backend = "poetry.masonry.api"
